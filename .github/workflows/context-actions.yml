name: context-actions tests

on:
  push:
    paths:
      - "windows/context-actions/**"
      - ".github/workflows/context-actions.yml"
  pull_request:
    paths:
      - "windows/context-actions/**"
      - ".github/workflows/context-actions.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows/context-actions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # 只用 uv run --with pytest，沒有 lock 檔可當快取 key
          enable-cache: false

      - uses: AnimMouse/setup-ffmpeg@v1

      - name: Show tool versions
        run: |
          command -v python3 7z ffmpeg uv
          python3 --version
          7z i | head -3
          ffmpeg -version | head -1

      - name: Python tests
        run: uv run --no-project --with pytest --with pytest-cov pytest -q --cov=. --cov-report=term test_*.py
